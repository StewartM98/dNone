<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fakeAR</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <!-- Add to Home Screen -> chrome-less kiosk mode.
       REQUIRED for the full-screen 1290x2796 composition: in normal Safari the
       address bar steals ~190px of height and you get side letterbox bars. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="fakeAR">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!-- 1. p5 - MUST stay on 1.x. p5 2.x reworked global mode and will break this. -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>

  <!-- 2. three.js r147 - the LAST release that ships examples/js as classic
       script files (examples/js was deleted in r148). Do not bump this
       version without porting the whole project to ES modules. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- optional: neutral image-based lighting, used only if the GLB has no lights -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>

  <!-- optional: only if you exported with Draco compression -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script> -->

  <!-- 3. the sketch. sketch.js MUST be last. -->
  <script src="config.js"></script>
  <script src="blendercam.js"></script>
  <script src="camfeed.js"></script>
  <script src="arlayer.js"></script>
  <script src="calibtouch.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
